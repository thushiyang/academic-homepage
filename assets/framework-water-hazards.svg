<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="title desc">
  <title id="title">Water hazards illustration</title>
  <desc id="desc">A stylized storm-rain, flood, great-wave, and breakwater motif representing water hazards.</desc>
  <defs>
    <linearGradient id="skyHazard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.48" stop-color="#edf7f9"/>
      <stop offset="1" stop-color="#f3e8f6"/>
    </linearGradient>
    <linearGradient id="stormCloud" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f2c8f"/>
      <stop offset="0.58" stop-color="#17476a"/>
      <stop offset="1" stop-color="#2f89a8"/>
    </linearGradient>
    <linearGradient id="deepWave" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123f5d"/>
      <stop offset="0.45" stop-color="#2f89a8"/>
      <stop offset="1" stop-color="#6f2c8f"/>
    </linearGradient>
    <linearGradient id="floodWater" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f89a8"/>
      <stop offset="0.52" stop-color="#7dc6cf"/>
      <stop offset="1" stop-color="#6f2c8f"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7eef2"/>
    </linearGradient>
    <filter id="softHazardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17476a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="520" height="280" rx="28" fill="url(#skyHazard)" opacity="0.8"/>

  <g opacity="0.92">
    <path d="M44 72 C58 48 90 44 108 60 C124 32 170 30 190 60 C214 50 246 60 252 84 C258 108 238 124 208 124 L72 124 C42 124 28 98 44 72 Z" fill="url(#stormCloud)" opacity="0.82"/>
    <path d="M76 138 L56 178 M112 138 L92 194 M148 138 L126 182 M184 138 L164 204 M220 138 L202 178" stroke="#2f89a8" stroke-width="8" stroke-linecap="round" opacity="0.48"/>
    <path d="M86 142 L72 168 M130 142 L116 174 M174 142 L160 168 M214 142 L200 172" stroke="#6f2c8f" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
  </g>

