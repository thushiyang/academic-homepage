    <path d="M372 88 C438 58 500 86 510 136 C520 190 462 224 398 190 C444 190 466 154 446 124 C428 98 400 88 372 88 Z" fill="url(#foam)" opacity="0.92"/>
    <path d="M394 88 C442 96 468 130 460 168 C452 204 404 208 356 180 C394 190 424 170 426 140 C428 116 414 100 394 88 Z" fill="#ffffff" opacity="0.5"/>
