    <path d="M12 28 L44 8 L76 28 M76 28 L108 8 L140 28 M140 28 L172 8 L204 28" fill="none" stroke="#a5792a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.86"/>
