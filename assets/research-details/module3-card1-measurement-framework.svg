<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Measurement framework for urban water resources system resilience</title>
  <desc id="desc">An English measurement framework for constructing, screening, weighting, validating, and applying U-WSR indicators.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f7f98"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182330}
      .title{font-size:42px;font-weight:800;fill:#4b1569}
      .sub{font-size:18px;fill:#5e6a78}
      .head{font-size:20px;font-weight:800;fill:#174f73}
      .small{font-size:16px;fill:#334155}
      .tiny{font-size:13px;fill:#5e6a78}
      .decision{font-size:17px;font-weight:800;fill:#4b1569}
      .box{fill:#fff;stroke:#7fa4b8;stroke-width:3}
      .soft{fill:#f8fbfb;stroke:#9bb5c4;stroke-width:2}
      .diamond{fill:#e7f3f6;stroke:#174f73;stroke-width:3}
      .line{stroke:#4f7f98;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .return{stroke:#8a6aa8;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1700" height="980" fill="#f8f4fb"/>
  <rect x="30" y="30" width="1640" height="920" fill="#fff" stroke="#7fa4b8" stroke-width="4"/>
  <text x="68" y="86" class="title">Measurement Framework</text>
  <text x="68" y="124" class="sub">Indicator construction, data validation, relevance screening, redundancy control, weighting, application feedback, and integrated resilience evaluation.</text>

  <g transform="translate(80 182)">
    <rect width="250" height="96" rx="10" class="box"/>
    <text x="125" y="38" text-anchor="middle" class="small">Theoretical &amp; Conceptual</text>
    <text x="125" y="64" text-anchor="middle" class="small">Measurement Framework</text>
  </g>
  <g transform="translate(425 182)">
    <rect width="250" height="96" rx="10" class="box"/>
    <text x="125" y="40" text-anchor="middle" class="small">Initial Proposal of</text>
    <text x="125" y="66" text-anchor="middle" class="small">Indicator System</text>
  </g>
  <g transform="translate(780 160)">
    <rect width="270" height="72" rx="10" class="box"/>
    <text x="135" y="44" text-anchor="middle" class="small">Data Accessibility</text>
    <rect y="102" width="270" height="72" rx="10" class="box"/>
    <text x="135" y="146" text-anchor="middle" class="small">Data Authenticity</text>
  </g>
  <g transform="translate(1175 172)">
    <path d="M105 0 L210 64 L105 128 L0 64 Z" class="diamond"/>
    <text x="105" y="70" text-anchor="middle" class="decision">Relevant?</text>
  </g>
  <g transform="translate(1448 190)">
    <rect width="190" height="94" rx="10" class="soft"/>
    <text x="95" y="36" text-anchor="middle" class="small">Revise or remove</text>
    <text x="95" y="62" text-anchor="middle" class="small">weak indicators</text>
  </g>
  <path class="line" d="M330 230 H420"/>
  <path class="line" d="M675 230 H775"/>
  <path class="line" d="M1050 230 H1170"/>
  <path class="line" d="M1385 236 H1442"/>
  <text x="1410" y="218" text-anchor="middle" class="tiny">No</text>

  <g transform="translate(1138 382)">
    <rect width="285" height="92" rx="10" class="box"/>
    <text x="142" y="38" text-anchor="middle" class="small">Delete Redundant /</text>
    <text x="142" y="66" text-anchor="middle" class="small">Correlated Indicators</text>
  </g>
  <path class="line" d="M1280 300 V376"/>
  <text x="1300" y="340" class="tiny">Yes</text>

  <g transform="translate(1030 566)">
    <rect width="285" height="90" rx="10" class="box"/>
    <text x="142" y="53" text-anchor="middle" class="small">Calculate Variable Weights</text>
  </g>
  <path class="line" d="M1280 474 C1280 520 1235 542 1172 562"/>

  <g transform="translate(700 720)">
    <path d="M120 0 L240 68 L120 136 L0 68 Z" class="diamond"/>
    <text x="120" y="74" text-anchor="middle" class="decision">Fits reality?</text>
  </g>
  <g transform="translate(1050 720)">
    <path d="M120 0 L240 68 L120 136 L0 68 Z" class="diamond"/>
    <text x="120" y="74" text-anchor="middle" class="decision">Comprehensive?</text>
  </g>
  <g transform="translate(1430 732)">
    <rect width="210" height="112" rx="10" class="box"/>
    <text x="105" y="44" text-anchor="middle" class="small">Integrate and</text>
    <text x="105" y="72" text-anchor="middle" class="small">Summarize Indicators</text>
  </g>
  <path class="line" d="M1120 656 C1025 682 938 704 842 722"/>
  <path class="line" d="M940 788 H1044"/>
  <path class="line" d="M1290 788 H1424"/>
  <text x="990" y="770" text-anchor="middle" class="tiny">Yes</text>
  <text x="1350" y="770" text-anchor="middle" class="tiny">Yes</text>

  <g transform="translate(86 610)">
    <rect width="330" height="136" rx="10" class="soft"/>
    <text x="165" y="40" text-anchor="middle" class="head">Evaluation &amp; Application</text>
    <text x="165" y="78" text-anchor="middle" class="small">Diagnosis, comparison, planning,</text>
    <text x="165" y="106" text-anchor="middle" class="small">management feedback</text>
  </g>
  <path class="return" d="M820 856 H251 V752"/>
  <path class="return" d="M1170 856 V910 H550 V282"/>
  <text x="548" y="842" text-anchor="middle" class="tiny">No: refine indicator system</text>
  <text x="1060" y="905" text-anchor="middle" class="tiny">No: revise weights and validation</text>

  <g transform="translate(470 424)">
    <rect width="390" height="210" rx="12" fill="#fbfefd" stroke="#9bb5c4" stroke-width="3"/>
    <text x="195" y="38" text-anchor="middle" class="head">PSR Diagnostic Logic</text>
    <circle cx="96" cy="122" r="45" fill="#fff1c9" stroke="#174f73" stroke-width="3"/>
    <circle cx="195" cy="122" r="45" fill="#e5f4f2" stroke="#174f73" stroke-width="3"/>
    <circle cx="294" cy="122" r="45" fill="#f3e4f6" stroke="#174f73" stroke-width="3"/>
    <text x="96" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#4b1569">Pressure</text>
    <text x="195" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#4b1569">State</text>
    <text x="294" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#4b1569">Response</text>
    <path d="M142 122 H148" stroke="#4f7f98" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M241 122 H247" stroke="#4f7f98" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M294 170 C245 203 145 203 96 170" fill="none" stroke="#8a6aa8" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <path class="line" d="M416 678 C440 640 446 558 466 528"/>
  <path class="line" d="M860 528 C925 514 980 496 1030 460"/>
</svg>
