<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="title desc">
  <title id="title">Water resources illustration</title>
  <desc id="desc">A stylized landscape with mountains, reservoir, river, and boat.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.55" stop-color="#e8f4f6"/>
      <stop offset="1" stop-color="#f6eef8"/>
    </linearGradient>
    <linearGradient id="mountainA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7e5ca6"/>
      <stop offset="1" stop-color="#2f89a8"/>
    </linearGradient>
    <linearGradient id="mountainB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3f8f7a"/>
      <stop offset="1" stop-color="#6f2c8f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="0">
